#
# ocserv.conf — minimal, sane defaults for a small VPN server
#
# This file is intended to be copied to /etc/ocserv/ocserv.conf by:
#   openconnect/install.sh
#
# The installer script will override the following keys:
#   auth, tcp-port, udp-port, server-cert, server-key, ipv4-network, ipv4-netmask
#

#
# Authentication (overridden by install.sh)
#
# Default: auth is not set (server won't accept users until configured)
auth = "plain[passwd=/etc/ocserv/ocpasswd]"

#
# Listener ports (overridden by install.sh)
#
# Default: 443
tcp-port = 443
# Default: 443
udp-port = 443

#
# Worker privileges
#
# Default: nobody
run-as-user = nobody
# Default: daemon
run-as-group = daemon

#
# IPC socket (used by occtl)
#
# Default: /var/run/ocserv-socket
socket-file = /var/run/ocserv-socket

#
# TLS certificate (overridden by install.sh)
# server-cert may include the full certificate chain.
#
# Default: not set
server-cert = /etc/ssl/certs/ssl-cert-snakeoil.pem
# Default: not set
server-key = /etc/ssl/private/ssl-cert-snakeoil.key

#
# Security / isolation
#
# NOTE: some environments/kernel+seccomp combinations may cause TLS handshake
# failures with worker isolation enabled. Keep this off unless you explicitly
# need it and have verified it works on your host.
# Default: true
isolate-workers = false

#
# Limits
#
# Default: 16
max-clients = 16
# Default: 2
max-same-clients = 2

#
# Keepalive / dead peer detection (reasonable defaults)
#
# Default: 32400
keepalive = 32400
# Default: 90
dpd = 90
# Default: 1800
mobile-dpd = 1800

#
# Networking
# NOTE: ocserv does not configure NAT/firewall rules; your system must do it.
# (install.sh configures UFW NAT masquerading for the chosen subnet)
#
# The tun device name prefix. This is REQUIRED.
# Default: vpns
device = vpns

# Default: 192.168.1.0
ipv4-network = "10.10.10.0"
# Default: "255.255.255.0"
ipv4-netmask = "255.255.255.0"

# Conservative MTU for better cross-network stability/performance.
# Default: 1420 (kernel TUN device MTU is used)
mtu = 1300
# Higher buffer improves throughput under load.
# Default: 10
output-buffer = 50

# Optionally push DNS servers to clients:
dns = 1.1.1.1
dns = 8.8.8.8
tunnel-all-dns = true

# Route all traffic through VPN (default). For split tunneling, use route/no-route.
#route = default
